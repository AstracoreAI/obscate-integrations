[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "obscate-mcp"
version = "0.1.0"
description = "MCP server for Obscate: reversible PII redaction (redact, restore, detect, JSON) for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Skycast" }]
keywords = ["mcp", "pii", "redaction", "privacy", "llm", "agents", "dpdp", "gdpr"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Development Status :: 4 - Beta",
]
dependencies = ["mcp>=2.0,<3", "httpx>=0.27"]

[project.urls]
Homepage = "https://obscate.com"
Documentation = "https://obscate.com/docs/mcp"

[project.scripts]
obscate-mcp = "obscate_mcp.server:main"

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/obscate_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
# server.json is MCP-registry metadata, published separately; not part of the package
exclude = ["server.json"]
